<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồng Nhung — Monograph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: editorial, quiet, confident — a model's monograph book
   IDEA: a printed lookbook spread: oversized headline page facing a 9:16 plate (photo or video)
   PICTURE: the featured 9:16 media; a filmstrip ribbon of contacts below
   COLOUR and TYPE: paper white / ink black, one lipstick accent; Archivo condensed 800 + Inter
   LAYOUT: spread over a moving ribbon; on phones a full-bleed story card with the title on it */
:root{color-scheme:light dark;
  --bg:light-dark(#f3f1ed,#0f0e0d);--ink:light-dark(#121110,#f1eee8);
  --mute:light-dark(#6d6862,#a39d95);--line:light-dark(#d9d4cc,#2c2926);
  --acc:#e0336f;--rib:132px;--sh:clamp(420px,calc(100vh - var(--rib) - 132px),920px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* thanh header kiểu Apple: mảnh, dính trên cùng, nền mờ trong suốt, menu chữ nhỏ ở giữa */
header{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:20px;height:48px;
  padding:0 max(4vw,16px,calc((100% - 1680px)/2 + 4vw));font-size:12px;letter-spacing:-.01em;
  background:light-dark(rgb(245 243 239/.62),rgb(22 21 20/.62));-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid light-dark(rgb(0 0 0/.08),rgb(255 255 255/.08))}
header b{font-weight:600;font-size:14px;letter-spacing:-.02em}
header .sub{color:var(--mute)}
header>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats{display:flex;justify-content:flex-end;gap:clamp(18px,2.2vw,34px);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:44px;padding:0;border:0;background:none;color:var(--ink);opacity:.5;font-size:12px;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;position:relative;transition:opacity .2s}
.cats button:hover{opacity:1}
.cats button[aria-pressed=true]{opacity:1;font-weight:600}
.cats button .c{display:none}
.cats button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.spread{display:grid;align-content:center;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lead stage" "side stage";gap:28px clamp(24px,4vw,64px);padding:8px max(4vw,16px) 28px;align-items:stretch;width:100%;max-width:1680px;margin-inline:auto}
.note{width:100%;max-width:1680px;margin-inline:auto}
.lead{grid-area:lead;display:flex;flex-direction:column;justify-content:flex-end;gap:28px;padding-top:8px}
.stage{grid-area:stage}
.side{grid-area:side;display:flex;flex-direction:column;justify-content:flex-end;gap:22px;max-width:520px}
.nextp{display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 0 0;cursor:pointer;width:100%}
.nextp[hidden]{display:none!important}
.nextp .k{grid-column:2;font-size:13px;color:var(--mute);align-self:end}
.nextp img{grid-row:1/3;grid-column:1;width:48px;aspect-ratio:9/16;object-fit:cover;border-radius:2px;background:var(--line)}
.nextp #npT{grid-column:2;font-weight:600;font-size:15px;line-height:1.3;align-self:start}
.nextp:hover #npT{text-decoration:underline;text-underline-offset:3px}
.nextp:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
@media(min-width:1100px){
  /* cột trái và phải bằng nhau để slide nằm giữa; cả 3 cột cao đúng bằng slide */
  .spread{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:var(--sh);grid-template-areas:"lead stage side";gap:clamp(32px,4vw,80px);align-items:stretch}
  .lead,.side{min-height:0;padding-top:0}
  .side{max-width:400px}
  .side{justify-content:flex-start}
  .side .cap{margin-top:auto}
  .side .nextp{order:-1;border-top:0;padding-top:0}
}
.count{display:flex;align-items:center;gap:14px;font:500 14px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.bar{flex:0 0 120px;height:2px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.ttl{margin:0;font-family:Archivo,sans-serif;font-weight:800;font-stretch:72%;text-transform:uppercase;
  font-size:clamp(48px,6vw,116px);line-height:1;letter-spacing:-.01em;text-wrap:balance;max-width:10ch}
/* chừa chỗ cho dấu tiếng Việt: dấu chồng trên (Ế, Ầ), dấu nặng dưới (Ệ, Ặ), móc (Ớ, Ư) */
/* không cắt khung chữ (tránh lộ mép/viền chữ khi chạy hiệu ứng, nhất là trên iOS) — chữ trồi lên kèm hiện dần */
.ttl .w{display:inline-block;vertical-align:top}
.ttl .w>span{display:inline-block;will-change:transform,opacity;backface-visibility:hidden}
.cap{font-size:17px;max-width:46ch;margin:14px 0 0}
.meta{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:6px 20px;max-width:520px;font-size:15px;margin:0}
.meta dt{color:var(--mute)}.meta dd{margin:0}
.nav{display:flex;gap:8px;align-items:center}
.btn{height:44px;min-width:44px;padding:0 16px;border:1px solid var(--line);background:transparent;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.th:focus-visible,.seg button:focus-visible,.snd:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stage{position:relative;overflow:hidden;background:#111;border-radius:2px;height:var(--sh);aspect-ratio:9/16;width:auto;margin:0;touch-action:pan-y;cursor:pointer}
.stage .m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.stage .lay{overflow:hidden;background:#111}
.tag{position:absolute;left:14px;bottom:14px;z-index:5;background:var(--bg);color:var(--ink);font-size:13px;padding:6px 10px;border-radius:999px;pointer-events:none}
.snd{position:absolute;right:12px;top:12px;z-index:6;width:44px;height:44px;padding:0;justify-content:center;border:0;border-radius:50%;background:rgb(0 0 0/.55);color:#fff;font-size:13px;display:none;align-items:center;gap:6px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stage.vid .snd{display:inline-flex}
.snd svg{width:20px;height:20px}
.pp{position:absolute;left:50%;top:50%;z-index:6;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgb(0 0 0/.5);display:grid;place-items:center;opacity:0;transition:opacity .25s;pointer-events:none}
.stage.paused .pp{opacity:1}
.pp svg{width:24px;height:24px;fill:#fff}
.ov{display:none}
.hint{display:none}
@keyframes nudge{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
/* một kiểu nút chung: trên slide (mobile) và ở cột phải (desktop) */
.ob,.nb{display:grid;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:rgb(0 0 0/.42);color:#fff;cursor:pointer;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s}
.ob{position:absolute;top:50%;z-index:6;margin-top:-22px;display:none}
.nb{background:light-dark(rgb(0 0 0/.42),rgb(255 255 255/.16))}
.ob:hover{background:rgb(0 0 0/.62)}.nb:hover{background:light-dark(rgb(0 0 0/.62),rgb(255 255 255/.28))}
.nb:active{transform:scale(.92)}
.nb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ob.l{left:10px}.ob.r{right:10px}
.ob:active{transform:scale(.92)}
.ob:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ribbon{position:relative;height:calc(var(--rib) + 28px + env(safe-area-inset-bottom));overflow:hidden;border-top:1px solid var(--line);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ribbon.drag{cursor:grabbing}
.track{position:absolute;left:0;top:14px;display:flex;gap:10px;will-change:transform}
.th{flex:none;display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;cursor:pointer;text-align:left;position:relative}
.th img{height:var(--rib);width:auto;display:block;pointer-events:none;-webkit-user-drag:none;transition:opacity .3s,filter .3s}
.th .d{position:absolute;right:5px;top:calc(var(--rib) - 24px);height:19px;padding:0 6px 0 5px;border-radius:999px;background:rgb(0 0 0/.6);color:#fff;font:500 11px/19px Inter,sans-serif;display:flex;gap:3px;align-items:center;font-variant-numeric:tabular-nums}
.th .d svg{width:8px;height:8px;fill:#fff}
.th .n{font:500 12px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);position:relative;padding-bottom:4px;align-self:flex-start}
.th.on .n{color:var(--ink)}
[data-mark=underline] .th .n::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .35s}
[data-mark=underline] .th.on .n::after{transform:scaleX(1)}
/* mục đang chọn: gạch dưới chân ảnh */
.th::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:2px;border-radius:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.th.on::after{transform:scaleX(1)}
[data-mark=minimal] .th.on .n{font-weight:600}
[data-mark=minimal] .th.on .n::before{content:"● ";color:var(--acc)}
details.set summary{list-style:none}details.set summary::-webkit-details-marker{display:none}
details.set{position:relative}
.panel{position:absolute;right:0;top:52px;z-index:20;width:min(320px,86vw);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;box-shadow:0 18px 40px rgb(0 0 0/.14)}
.panel label{font-size:13px;color:var(--mute);display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--line);padding:3px;border-radius:10px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:8px;font-size:13px;cursor:pointer;padding:0 8px}
.seg button[aria-pressed=true]{background:var(--bg);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.note{font-size:13px;color:var(--mute);padding:0 max(4vw,16px) calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}

@media(max-width:820px){
  :root{--rib:78px}
  header{position:fixed;left:0;right:0;top:0;height:44px;padding:0 16px}
  .app{grid-template-rows:minmax(0,1fr) auto}
  .cats{gap:16px}
  header{gap:12px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  .cta{justify-self:end}
  .cats button{height:44px}
  header .sub{display:none}
  .spread{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side";gap:0;padding:0}
  .lead{display:none}
  .side .nav{display:none}
  .ob{display:grid}
  .stage{width:100%;aspect-ratio:auto;height:100svh;min-height:560px;border-radius:0}
  .stage,.side{touch-action:none}
  html,body{overscroll-behavior:none}
  /* nút điều hướng thành lên/xuống, xếp dọc bên phải như Reels/TikTok */
  .ob.l,.ob.r{left:auto;right:12px}
  .ob.l{top:calc(50% - var(--sideH,150px)/2 + 22px - 28px)}
  .ob.r{top:calc(50% - var(--sideH,150px)/2 + 22px + 28px)}
  .ob svg{transform:rotate(90deg)}
  .hint{position:absolute;left:50%;top:58px;z-index:7;transform:translateX(-50%);display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;font-size:12px;color:#fff;white-space:nowrap;pointer-events:none;
    background:linear-gradient(180deg,rgb(255 255 255/.24),rgb(255 255 255/.06)),rgb(20 20 20/.2);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid rgb(255 255 255/.3);box-shadow:inset 0 1px 0 rgb(255 255 255/.5);transition:opacity .4s}
  .hint svg{animation:nudge 1.4s ease-in-out infinite}
  .hint.gone{opacity:0}
  .snd{top:56px}
  .tag{display:none}
  .ov{display:flex;flex-direction:column;justify-content:flex-end;position:absolute;inset:0;z-index:4;padding:16px 16px calc(var(--sideH,150px) + 16px);color:#fff;pointer-events:none;
    background:linear-gradient(180deg,rgb(0 0 0/.42),transparent 22%,transparent 45%,rgb(0 0 0/.72) calc(100% - var(--sideH,150px)),rgb(0 0 0/.42))}
  .ov .count{gap:10px;font-size:13px}
  .ov .bar{flex-basis:72px;background:rgb(255 255 255/.3)}.ov .bar i{background:#fff}
  .ov .ttl{font-size:clamp(40px,12.5vw,68px);max-width:none;text-wrap:pretty;color:#fff}
  .stage.vid .ov .ttl{padding-right:0}
  /* khối mô tả + thông tin luôn dính đáy màn hình */
  .side{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:none;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:light-dark(rgb(245 243 239/.6),rgb(22 21 20/.6));-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
    border-top:1px solid light-dark(rgb(255 255 255/.5),rgb(255 255 255/.1));box-shadow:inset 0 1px 0 light-dark(rgb(255 255 255/.6),rgb(255 255 255/.08))}
  .app{padding-bottom:0}
  .ribbon{display:none}
  .nextp{display:none}
  /* cố định layout khi đổi nội dung: mô tả luôn chiếm đúng 2 dòng, 3 cột thông tin chia đều */
  .cap{margin:0;font-size:15px;line-height:1.45;height:2.9em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
  /* độ rộng mỗi cột = chữ dài nhất của cột đó trong toàn bộ nội dung (đo bằng JS) → không nhảy, không cắt chữ */
  .meta{grid-auto-flow:column;grid-template-rows:auto auto;grid-template-columns:var(--mc,repeat(3,auto));justify-content:space-between;gap:2px 8px;font-size:14px}
  .meta dt,.meta dd{white-space:nowrap}
  .meta.wrap dd{white-space:normal;min-height:2.7em;line-height:1.35}
  .panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));top:auto;width:auto;z-index:50;box-shadow:0 -10px 50px rgb(0 0 0/.25)}
  .th .d{top:calc(var(--rib) - 22px);font-size:10px;height:17px;line-height:17px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
/* ===== Liquid glass ===== */
:root{--gl-hi:rgb(255 255 255/.6);--gl-ease:cubic-bezier(.2,.9,.25,1.15)}
/* trên ảnh/video: kính trong, chữ trắng */
.ob,.snd,.tag,.th .d,.pp{
  background:linear-gradient(180deg,rgb(255 255 255/.26),rgb(255 255 255/.06)) ,rgb(20 20 20/.18)!important;
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  border:1px solid rgb(255 255 255/.32)!important;color:#fff!important;
  box-shadow:inset 0 1px 0 rgb(255 255 255/.55),inset 0 -1px 0 rgb(255 255 255/.10),0 8px 24px rgb(0 0 0/.22)}
.ob,.snd,.nb,.cta,.mdl-x,.ct a,.ct .row{transition:transform .35s var(--gl-ease),box-shadow .3s,background .3s}
.ob::before,.snd::before,.nb::before,.cta::before,.mdl-x::before{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 30% 0%,rgb(255 255 255/.45),transparent 55%);opacity:.7;mix-blend-mode:screen}
.ob:hover,.snd:hover{transform:scale(1.06)}.ob:active,.snd:active,.nb:active,.cta:active{transform:scale(.94)}
.nb,.cta,.mdl-x{position:relative;overflow:hidden}
.snd{overflow:hidden}
.tag{padding:6px 12px!important;font-weight:500}
.th .d{border-radius:999px}
.pp{border-radius:50%}
/* trên nền trang: kính sữa, chữ theo theme */
.nb{
  background:linear-gradient(180deg,light-dark(rgb(255 255 255/.85),rgb(255 255 255/.16)),light-dark(rgb(255 255 255/.45),rgb(255 255 255/.05)))!important;
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  border:1px solid light-dark(rgb(0 0 0/.08),rgb(255 255 255/.18))!important;color:var(--ink)!important;
  box-shadow:inset 0 1px 0 light-dark(rgb(255 255 255/.95),rgb(255 255 255/.25)),0 6px 18px light-dark(rgb(0 0 0/.08),rgb(0 0 0/.35))}
.nb:hover{transform:scale(1.06)}
/* CTA đỏ hồng TikTok, kính màu */
.cta{height:32px;padding:0 16px;border-radius:999px;border:1px solid rgb(255 255 255/.35);cursor:pointer;color:#fff;font:600 12px/1 Inter,sans-serif;letter-spacing:-.01em;white-space:nowrap;
  background:linear-gradient(180deg,rgb(255 92 124/.96),rgb(254 44 85/.94) 55%,rgb(226 24 66/.96));
  box-shadow:inset 0 1px 0 rgb(255 255 255/.55),inset 0 -1px 0 rgb(0 0 0/.12),0 6px 18px rgb(254 44 85/.38)}
.cta:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgb(255 255 255/.6),0 10px 26px rgb(254 44 85/.48)}
.cta:focus-visible{outline:2px solid #fe2c55;outline-offset:3px}
/* Modal */
.mdl{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px}
.mdl[hidden]{display:none}
.mdl-bg{position:absolute;inset:0;background:rgb(10 8 8/.38);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}
.mdl-card{position:relative;width:min(420px,100%);border-radius:30px;padding:28px 22px 22px;color:#fff;isolation:isolate;overflow:hidden;
  background:linear-gradient(140deg,rgb(255 255 255/.30),rgb(255 255 255/.10) 45%,rgb(255 255 255/.16));
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgb(255 255 255/.42);
  box-shadow:inset 0 1px 0 rgb(255 255 255/.7),inset 0 0 0 1px rgb(255 255 255/.06),inset 0 -20px 40px rgb(255 255 255/.05),0 30px 80px rgb(0 0 0/.35)}
.mdl-card::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(240px 180px at var(--mx,20%) var(--my,0%),rgb(255 255 255/.35),transparent 70%),radial-gradient(160% 60% at 50% 120%,rgb(254 44 85/.18),transparent 60%)}
.mdl-card h2{margin:0 0 6px;font:800 30px/1.05 Archivo,sans-serif;font-stretch:72%;text-transform:uppercase;letter-spacing:-.01em}
.mdl-sub{margin:0 0 18px;font-size:14px;opacity:.82;max-width:32ch}
.mdl-x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;
  background:rgb(255 255 255/.14);border:1px solid rgb(255 255 255/.3);box-shadow:inset 0 1px 0 rgb(255 255 255/.5)}
.mdl-x:hover{transform:rotate(90deg)}
.mdl-x:focus-visible,.ct a:focus-visible,.ct button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ct{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ct a,.ct .row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:58px;padding:8px 12px 8px 8px;border-radius:18px;color:#fff;text-decoration:none;
  background:linear-gradient(180deg,rgb(255 255 255/.18),rgb(255 255 255/.06));border:1px solid rgb(255 255 255/.22);box-shadow:inset 0 1px 0 rgb(255 255 255/.35)}
.ct a:hover{transform:translateY(-2px) scale(1.01);background:linear-gradient(180deg,rgb(255 255 255/.26),rgb(255 255 255/.1))}
.ct .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 4px 12px rgb(0 0 0/.18)}
.ct .ic svg{width:22px;height:22px}
.ct b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.ct small{display:block;font-size:13px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .go{opacity:.7}
.ct .cp{height:32px;padding:0 12px;border-radius:999px;border:1px solid rgb(255 255 255/.3);background:rgb(255 255 255/.14);color:#fff;font-size:12px;cursor:pointer}
.ct .off{opacity:.55}
@media(max-width:600px){.mdl{place-items:end center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}.mdl-card{border-radius:28px}}
@media(prefers-reduced-motion:reduce){.mdl-card,.mdl-bg{animation:none!important}}

</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div><b>Hồng Nhung</b><span class="sub"> · Profile KOL / Model</span></div>
    <nav class="cats" id="cats" aria-label="Lọc theo hạng mục"></nav>
    <button class="cta" id="cta" type="button" aria-haspopup="dialog">Liên hệ</button>
  </header>

  <main class="spread">
    <section class="lead">
      <h1 class="ttl" id="ttl"></h1>
    </section>
    <figure class="stage" id="stage">
      <div class="ov" aria-hidden="true">
        <div class="ttl" id="ttl2"></div>
      </div>
      <span class="tag" id="tag"></span>
      <span class="hint" id="hint" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>Vuốt lên để xem tiếp</span>
      <button class="snd" id="snd" type="button"></button>
      <button class="ob l" id="oprev" type="button" aria-label="Mục trước"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ob r" id="onext" type="button" aria-label="Mục sau"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="pp" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></span>
    </figure>
    <section class="side" aria-live="polite">
      <button class="nextp" id="nextp" type="button"><span class="k">Tiếp theo</span><img id="npImg" alt=""><span id="npT"></span></button>
      <p class="cap" id="cap"></p>
      <dl class="meta" id="meta"></dl>
      <div class="nav">
        <button class="nb" id="prev" type="button" aria-label="Mục trước"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="nb" id="next" type="button" aria-label="Mục sau"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </section>
  </main>

  <div class="ribbon" id="rib" aria-label="Danh sách ảnh và video"><div class="track" id="track"></div></div>
</div>

<div class="mdl" id="mdl" hidden>
  <div class="mdl-bg" data-close></div>
  <div class="mdl-card" role="dialog" aria-modal="true" aria-labelledby="mdlT">
    <button class="mdl-x" type="button" data-close aria-label="Đóng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="mdlT">Liên hệ hợp tác</h2>
    <p class="mdl-sub">Booking chụp ảnh, quay quảng cáo, review sản phẩm và livestream.</p>
    <ul class="ct" id="ct"></ul>
  </div>
</div>

<script>
{
/* Thêm nội dung: mỗi mục là {type:"image"|"video", src, poster?, t, c, cat, role, y, link?}.
   Video nên là .mp4 (H.264), khung 9:16; poster là ảnh bìa hiện ở ribbon. */
const items=[
 {type:"image",src:"img/astudio.jpg",t:"Chân dung studio",c:"Bộ ảnh chân dung tại A Studio — ánh sáng mềm, tông đen trầm, tập trung vào thần thái.",cat:"Hình ảnh cá nhân",role:"Người mẫu",y:"2025"},
 {type:"image",src:"img/portrait.jpg",t:"Nắng chiều phố cũ",c:"Street look năng động: mũ lưỡi trai, denim và bức tường đá phủ rêu.",cat:"Hình ảnh cá nhân",role:"Người mẫu",y:"2025"},
 {type:"video",src:"vid/the-gioi-nem.mp4",poster:"img/the-gioi-nem.jpg",t:"Thế Giới Nệm 17 năm",c:"TVC mừng sinh nhật 17 năm của chuỗi Thế Giới Nệm, quay tại showroom.",cat:"Quay quảng cáo",role:"Diễn viên quảng cáo",y:"2025"},
 {type:"image",src:"img/hinh-le-01.jpg",t:"Thuyền giữa rừng tràm",c:"Áo hồng, nón lá và mặt nước xanh — một khung hình mang màu ký ức miền Tây.",cat:"Hình lẻ",role:"Người mẫu",y:"2025"},
 {type:"video",src:"vid/makeup.mp4",poster:"img/makeup.jpg",t:"Áo dài & makeup",c:"Áo dài lụa hồng phấn đi cùng tóc xoăn nhẹ và makeup trong trẻo.",cat:"Áo dài + Makeup",role:"Người mẫu",y:"2025"},
 {type:"image",src:"img/hinh-le-02.jpg",t:"Váy trắng nắng sớm",c:"Concept nằm trên tảng đá giữa nắng xuyên lá, chất liệu voan bắt sáng.",cat:"Hình lẻ",role:"Người mẫu",y:"2025"},
 {type:"video",src:"vid/trang-rang.mp4",poster:"img/trang-rang.jpg",t:"Review trắng răng",c:"Video review sản phẩm làm trắng răng: trải nghiệm thật, nói gọn ý chính.",cat:"Review sản phẩm",role:"Reviewer",y:"2025"},
 {type:"image",src:"img/chickenplus.jpg",t:"Chicken Plus × Coca-Cola",c:"Phiên livestream ẩm thực, giới thiệu combo gà rán cùng đại diện thương hiệu.",cat:"Livestream",role:"Host livestream",y:"2025"},
 {type:"video",src:"vid/diep-lam-anh.mp4",poster:"img/diep-lam-anh.jpg",t:"Live cùng Diệp Lâm Anh",c:"Đồng hành livestream cùng khách mời nổi tiếng, giữ nhịp tương tác suốt phiên.",cat:"Livestream",role:"Co-host",y:"2025"},
 {type:"image",src:"img/huko.jpg",t:"Huko — da bật tone",c:"Livestream mỹ phẩm: demo kem dưỡng trực tiếp, chốt deal theo khung giờ.",cat:"Livestream",role:"Host livestream",y:"2025"},
 {type:"video",src:"vid/bly.mp4",poster:"img/bly.jpg",t:"BLY Boutique",c:"Thời trang trực tiếp từ boutique: thử đồ, phối đồ và trả lời bình luận.",cat:"Livestream",role:"Host livestream",y:"2025"},
 {type:"image",src:"img/live-01.jpg",t:"Thế giới đồ chơi",c:"Phiên live giữa kệ thú bông pastel, giới thiệu từng mẫu blind box.",cat:"Livestream",role:"Host livestream",y:"2025"},
 {type:"video",src:"vid/smec.mp4",poster:"img/smec.jpg",t:"SMEC — Review sản phẩm",c:"Mở hộp và review thiết bị gia dụng cùng đại diện nhãn hàng.",cat:"Livestream",role:"Host livestream",y:"2025"},
 {type:"image",src:"img/miniso.jpg",t:"MINISO Global Live",c:"Livestream cho MINISO với gian hàng đồ chơi, phụ kiện và quà tặng.",cat:"Livestream",role:"Host livestream",y:"2025"},
 {type:"video",src:"vid/tu-vi.mp4",poster:"img/tu-vi.jpg",t:"Live cùng Tú Vi",c:"Phiên live đôi giới thiệu sản phẩm chăm sóc tóc, nhịp nói nhanh và vui.",cat:"Livestream",role:"Co-host",y:"2025"},
 {type:"video",src:"vid/y-sister.mp4",poster:"img/y-sister.jpg",t:"Y-Sister deal vô bờ",c:"Trích đoạn 60 giây từ phiên live thời trang Y-Sister.",cat:"Livestream",role:"Host livestream",y:"2025"}
];
const groups=[
 {id:"hinh-anh",label:"Hình ảnh",type:"image"},
 {id:"video",label:"Video",type:"video"}
].map(g=>({...g,idx:items.map((it,i)=>i).filter(i=>items[i].type===g.type)})).filter(g=>g.idx.length);
let list=groups[0].idx,grp=groups[0].id;
const step=d=>{const k=list.indexOf(cur);return k<0?list[0]:list[(k+d+list.length)%list.length]};
const $=id=>document.getElementById(id),$$=s=>document.querySelectorAll(s);
const app=$("app"),stage=$("stage"),track=$("track"),rib=$("rib"),snd=$("snd");
const mob=matchMedia("(max-width:820px)");
let hinted=false;const hint=()=>{if(hinted)return;hinted=true;const h=document.getElementById("hint");if(h){h.classList.add("gone");setTimeout(()=>h.remove(),500)}};setTimeout(hint,6000);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad=n=>String(n).padStart(2,"0");
const fmt=s=>Math.floor(s/60)+":"+pad(Math.round(s%60));
const IC={off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
 on:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8a5 5 0 0 1 0 8M19.5 5.5a8.5 8.5 0 0 1 0 13"/></svg>',
 play:'<svg viewBox="0 0 10 10"><path d="M2 1v8l7-4z"/></svg>'};
/* Hiệu ứng đã chốt — cố định cho mọi người xem */
const st={tr:"wipe",mark:"underline",dir:1,spd:25,dur:6,sound:false};
const save=()=>{};
let cur=-1,t0=0,media=null,layer=null,userPaused=false;

function words(el,text){
  el.innerHTML="";
  text.split(" ").forEach((w,k)=>{const o=document.createElement("span"),n=document.createElement("span");o.className="w";n.textContent=w;o.append(n);el.append(o," ");
    if(!reduce)n.animate([{transform:"translateY(.45em)",opacity:0},{transform:"translateY(0)",opacity:1}],{duration:700,delay:120+k*70,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"})});
}
function sndUI(){snd.innerHTML=st.sound?IC.on:IC.off;const l=st.sound?"Tắt tiếng":"Bật tiếng";snd.setAttribute("aria-label",l);snd.title=l;snd.setAttribute("aria-pressed",st.sound)}

/* featured */
function show(i,dirn=1){
  if(i===cur||i==null)return;
  const it=items[i],old=layer,oldMedia=media;cur=i;userPaused=false;stage.classList.remove("paused");
  let m;
  if(it.type==="video"){
    /* iOS/Android chỉ cho tự phát khi video tắt tiếng + playsinline, phải đặt trước khi gán src */
    m=document.createElement("video");
    m.muted=true;m.defaultMuted=true;m.setAttribute("muted","");
    m.playsInline=true;m.setAttribute("playsinline","");m.setAttribute("webkit-playsinline","");
    m.autoplay=true;m.setAttribute("autoplay","");m.preload="auto";
    if(it.poster)m.poster=it.poster;m.src=it.src;
    if(st.sound)m.addEventListener("playing",()=>{if(st.sound)m.muted=false},{once:true});
    m.addEventListener("ended",()=>{if(media!==m)return;if(step(1)===cur){m.currentTime=0;m.play().catch(()=>{})}else show(step(1),1)});
    m.addEventListener("error",()=>{if(media===m){m.dataset.err=1;t0=performance.now()}}); // file lỗi thì coi như ảnh, tự chuyển
    const go=()=>m.play().catch(()=>{m.muted=true;st.sound=false;sndUI();m.play().catch(()=>{if(media===m){userPaused=true;stage.classList.add("paused")}})});
    go();
  }else{m=new Image();m.src=it.src;m.alt=it.t;m.decoding="async"}
  /* mỗi slide là 1 lớp: video nằm trên ảnh poster, video chỉ hiện khi đã có khung hình → chuyển mượt như ảnh, không bị đen */
  const L=document.createElement("div");L.className="m lay";const IN=document.createElement("div");IN.className="m";L.append(IN);
  if(it.type==="video"){const pi=new Image();pi.src=it.poster||"";pi.alt="";pi.className="m";IN.append(pi);
    m.style.opacity=0;const reveal=()=>{m.style.transition="opacity .35s";m.style.opacity=1};
    m.addEventListener("playing",reveal,{once:true});m.addEventListener("loadeddata",()=>{if(m.paused)reveal()},{once:true})}
  m.className="m";IN.append(m);stage.insertBefore(L,stage.firstChild);media=m;layer=L;
  stage.classList.toggle("vid",it.type==="video");
  if(old){
    if(oldMedia&&oldMedia.pause)oldMedia.pause();
    if(!reduce){
      const ax=mob.matches?"Y":"X"; // mobile: chuyển theo chiều dọc như vuốt lên
      const o={duration:mob.matches?750:900,easing:"cubic-bezier(.7,0,.2,1)",fill:"both"};
      const k={
        /* wipe bằng 2 lớp transform ngược chiều (không dùng clip-path) → video trên iOS/Safari cũng wipe như ảnh */
        wipe:[{transform:`translate${ax}(${dirn*100}%)`},{transform:"none"}],
        slide:[{transform:`translate${ax}(${dirn*100}%)`},{transform:"none"}],
        fade:[{opacity:0},{opacity:1}],
        zoom:[{opacity:0,transform:"scale(1.18)"},{opacity:1,transform:"scale(1)"}]
      }[st.tr];
      // keep stacking order: new media above old
      stage.insertBefore(L,old.nextSibling);
      if(st.tr==="slide")old.animate([{transform:"none"},{transform:`translate${ax}(${-dirn*35}%)`}],o);
      if(st.tr==="wipe")old.animate([{transform:"scale(1)"},{transform:"scale(1.06)"}],o);
      if(st.tr==="wipe")IN.animate([{transform:`translate${ax}(${-dirn*100}%)`},{transform:"none"}],o);
      L.animate(k,o).finished.then(()=>old.remove(),()=>old.remove());
    }else old.remove();
  }
  $$(".cnt").forEach(e=>e.textContent=pad(i+1)+"/"+pad(items.length));
  $$(".cat").forEach(e=>e.textContent=it.cat);$("tag").textContent=it.cat;
  words($("ttl"),it.t);words($("ttl2"),it.t);
  const cp=$("cap");cp.textContent=it.c;
  if(!reduce)cp.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:600,delay:300,fill:"backwards"});
  const mt=$("meta");mt.innerHTML="";
  [["Hạng mục",it.cat],["Vai trò",it.role],[it.type==="video"?"Định dạng":"Năm",it.type==="video"?"Video":it.y]].forEach(([a,b])=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=a;dd.textContent=b;mt.append(dt,dd)});
  track.querySelectorAll(".th").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"true":"false")});
  t0=performance.now();
  $("nextp").hidden=list.length<2;const nx=items[step(1)];if(nx.type==="image")new Image().src=nx.src;
  $("npImg").src=nx.poster||nx.src;$("npT").textContent=nx.t+(nx.type==="video"?" · Video":"");
}
sndUI();
snd.addEventListener("click",e=>{e.stopPropagation();st.sound=!st.sound;save();sndUI();if(media&&media.tagName==="VIDEO"){media.muted=!st.sound;if(media.paused&&!userPaused)media.play().catch(()=>{})}});

/* stage: swipe to change, tap to pause/play a video */
let sw=null;
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".snd,.ob"))return;sw={x:e.clientX,y:e.clientY}});
stage.addEventListener("pointerup",e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)&&mob.matches){dy<0?show(step(1),1):show(step(-1),-1);hint();return} // vuốt lên = tiếp, vuốt xuống = trước
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){dx<0?show(step(1),1):show(step(-1),-1);hint();return}
  if(Math.abs(dx)<8&&Math.abs(dy)<8&&media&&media.tagName==="VIDEO"){
    if(media.paused){userPaused=false;media.play().catch(()=>{})}else{userPaused=true;media.pause()}
    stage.classList.toggle("paused",userPaused);
  }
});
stage.addEventListener("pointercancel",()=>sw=null);
/* mobile: vuốt lên/xuống trên khối mô tả cũng chuyển mục */
{const sd=document.querySelector(".side");let s2=null;
sd.addEventListener("pointerdown",e=>{if(mob.matches)s2={x:e.clientX,y:e.clientY}});
sd.addEventListener("pointerup",e=>{if(!s2)return;const dx=e.clientX-s2.x,dy=e.clientY-s2.y;s2=null;
  if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)){dy<0?show(step(1),1):show(step(-1),-1);hint()}});
sd.addEventListener("pointercancel",()=>s2=null);}

/* ribbon: lặp đủ số bản sao để luôn phủ kín chiều ngang, dựng lại khi đổi hạng mục */
const durs={};
function buildRibbon(){
  track.innerHTML="";
  const est=list.reduce((a,i)=>a+(items[i].src.includes("hinh-le-02")||items[i].src.includes("astudio")?.9:.6)*parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rib"))+10,0);
  const copies=Math.max(3,Math.ceil(innerWidth/Math.max(1,est))+2);
  for(let c=0;c<copies;c++)list.forEach(i=>{
    const it=items[i];
    const b=document.createElement("button");b.className="th"+(i===cur?" on":"");b.dataset.i=i;b.tabIndex=c?-1:0;
    if(c)b.setAttribute("aria-hidden","true");b.setAttribute("aria-label",it.t+(it.type==="video"?" (video)":""));
    const im=document.createElement("img");im.src=it.poster||it.src;im.alt="";im.loading=c>1?"lazy":"eager";im.draggable=false;
    im.addEventListener("load",measure);b.append(im);
    if(it.type==="video"){const d=document.createElement("span");d.className="d";d.dataset.i=i;d.innerHTML=IC.play+'<b style="font-weight:500">'+(durs[i]?fmt(durs[i]):"Video")+'</b>';b.append(d);
      if(!c&&!durs[i]){const p=document.createElement("video");p.preload="metadata";p.muted=true;p.src=it.src;
        p.addEventListener("loadedmetadata",()=>{durs[i]=p.duration;track.querySelectorAll('.d[data-i="'+i+'"] b').forEach(e=>e.textContent=fmt(p.duration));p.removeAttribute("src");p.load()},{once:true});}}
    track.append(b);
  });
  x=0;requestAnimationFrame(measure);
}
let setW=1,x=0,v=0,pend=0,drag=null,hover=false;
function measure(){const f=track.children[list.length];setW=f?f.offsetLeft:1}
const wrap=()=>{x=((x%setW)+setW)%setW};
let last=performance.now();
function loop(now){
  const dt=Math.min(64,now-last)/1000;last=now;
  if(pend){const k=1-Math.exp(-dt*(drag?18:9)),s2=pend*k;x+=s2;pend-=s2;if(Math.abs(pend)<.1){x+=pend;pend=0}}
  if(!drag){
    if(Math.abs(v)>4){x+=v*dt;v*=Math.pow(.08,dt)}else{v=0;if(!reduce&&!hover&&Math.abs(pend)<1)x+=st.spd*st.dir*dt}
  }
  wrap();track.style.transform=`translate3d(${-x}px,0,0)`;
  /* auto-advance: photos by timer, videos when they end */
  let p=0;
  if(media&&media.tagName==="VIDEO"&&!media.dataset.err){
    p=media.duration?media.currentTime/media.duration:0;
  }else if(!document.hidden){
    p=(now-t0)/(st.dur*1000);if(p>=1){if(step(1)===cur)t0=now;else show(step(1),1)}
  }
  $$(".bar i").forEach(e=>e.style.transform=`scaleX(${Math.min(1,p)})`);
  requestAnimationFrame(loop);
}
rib.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")hover=true});
rib.addEventListener("pointerleave",()=>hover=false);
rib.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  drag={sx:e.clientX,lx:e.clientX,lt:performance.now(),moved:false,th:e.target.closest(".th")};v=0;
  rib.setPointerCapture(e.pointerId);
});
rib.addEventListener("pointermove",e=>{
  if(!drag)return;const dx=e.clientX-drag.lx,now=performance.now();
  if(Math.abs(e.clientX-drag.sx)>6){drag.moved=true;rib.classList.add("drag")}
  pend-=dx;v=-dx/Math.max(1,now-drag.lt)*1000;drag.lx=e.clientX;drag.lt=now;
});
const end=()=>{
  if(!drag)return;rib.classList.remove("drag");
  if(!drag.moved){v=0;if(drag.th){const i=+drag.th.dataset.i;show(i,i>=cur?1:-1)}}
  else if(performance.now()-drag.lt>90)v=0;
  drag=null;
};
rib.addEventListener("pointerup",end);rib.addEventListener("pointercancel",end);
rib.addEventListener("wheel",e=>{const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(!d)return;e.preventDefault();pend+=d*(e.deltaMode===1?32:1);v=0},{passive:false});
track.addEventListener("click",e=>{const b=e.target.closest(".th");if(b&&e.detail===0){const i=+b.dataset.i;show(i,i>=cur?1:-1)}});

$("prev").onclick=()=>show(step(-1),-1);$("next").onclick=()=>show(step(1),1);
$("oprev").onclick=e=>{e.stopPropagation();show(step(-1),-1)};$("onext").onclick=e=>{e.stopPropagation();show(step(1),1);hint()};
$("nextp").onclick=()=>show(step(1),1);
document.addEventListener("keydown",e=>{if(e.target.closest("input")||!$("mdl").hidden)return;if(e.key==="ArrowRight"||e.key==="ArrowDown")show(step(1),1);if(e.key==="ArrowLeft"||e.key==="ArrowUp")show(step(-1),-1)});
document.addEventListener("visibilitychange",()=>{if(!media||media.tagName!=="VIDEO")return;if(document.hidden)media.pause();else if(!userPaused)media.play().catch(()=>{});t0=performance.now()});

const side=document.querySelector(".side");
const sideRO=new ResizeObserver(()=>{document.documentElement.style.setProperty("--sideH",(getComputedStyle(side).position==="fixed"?side.offsetHeight:0)+"px")});sideRO.observe(side);

function renderCats(){
  const nav=$("cats");nav.innerHTML="";
  groups.forEach(g=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",g.id===grp);
    b.append(g.label);const c=document.createElement("span");c.className="c";c.textContent=g.idx.length;b.append(c);
    b.onclick=()=>{if(location.hash.slice(1)!==g.id)location.hash=g.id;else setGroup(g.id)};nav.append(b)});
}
function setGroup(id){
  const g=groups.find(g=>g.id===id)||groups[0];grp=g.id;list=g.idx;renderCats();
  const nb=$("cats").querySelector('[aria-pressed="true"]');if(nb)nb.scrollIntoView({block:"nearest",inline:"nearest"});
  buildRibbon();
  $("nextp").hidden=list.length<2;
  if(!list.includes(cur))show(list[0],1);else{t0=performance.now();$("npImg").src=items[step(1)].poster||items[step(1)].src;$("npT").textContent=items[step(1)].t+(items[step(1)].type==="video"?" · Video":"")}
}
/* đo chữ dài nhất từng cột để cố định cột thông tin trên mobile */
function sizeMeta(){
  const mt=$("meta"),probe=document.createElement("dd");probe.style.cssText="position:absolute;visibility:hidden;white-space:nowrap";mt.append(probe);
  const w=t=>{probe.textContent=t;return Math.ceil(probe.getBoundingClientRect().width)+1};
  const cols=[["Hạng mục",...items.map(i=>i.cat)],["Vai trò",...items.map(i=>i.role)],["Năm","Định dạng",...items.map(i=>i.type==="video"?"Video":i.y)]];
  const ws=cols.map(c=>Math.max(...c.map(w)));probe.remove();
  const room=mt.clientWidth-16;
  document.documentElement.style.setProperty("--mc",ws.reduce((a,b)=>a+b,0)<=room?ws.map(x=>x+"px").join(" "):"repeat(3,minmax(0,1fr))");
  mt.classList.toggle("wrap",ws.reduce((a,b)=>a+b,0)>room);
}
addEventListener("resize",sizeMeta);if(document.fonts)document.fonts.ready.then(sizeMeta);
addEventListener("hashchange",()=>setGroup(location.hash.slice(1)));
const hdr=document.querySelector("header");
const hdrRO=new ResizeObserver(()=>document.documentElement.style.setProperty("--hdH",hdr.offsetHeight+"px"));hdrRO.observe(hdr);
setGroup(location.hash.slice(1));sizeMeta();requestAnimationFrame(loop);

const ct=$("ct");
contacts.forEach(c=>{
  const li=document.createElement("li");
  const has=!!(c.url||c.handle);
  const el=document.createElement(c.url?"a":"div");
  if(c.url){el.href=c.url;el.target="_blank";el.rel="noopener"}else el.className="row"+(has?"":" off");
  const ic=document.createElement("span");ic.className="ic";ic.style.background=c.tint;ic.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+c.icon+"</svg>";
  const tx=document.createElement("span");const b=document.createElement("b");b.textContent=c.label;const sm=document.createElement("small");sm.textContent=has?(c.handle||c.url.replace(/^https?:\/\//,"")):"Đang cập nhật";tx.append(b,sm);
  el.append(ic,tx);
  if(c.url){const g=document.createElement("span");g.className="go";g.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';el.append(g)}
  else if(c.copy&&has){const bt=document.createElement("button");bt.type="button";bt.className="cp";bt.textContent="Sao chép";
    bt.onclick=()=>{navigator.clipboard.writeText(c.handle).then(()=>{bt.textContent="Đã chép";setTimeout(()=>bt.textContent="Sao chép",1500)},()=>{bt.textContent="Không chép được"})};el.append(bt)}
  else el.append(document.createElement("span"));

});
const mdl=$("mdl"),card=mdl.querySelector(".mdl-card"),cta=$("cta");
function openM(){
  mdl.hidden=false;document.body.style.overflow="hidden";
  if(!reduce){mdl.querySelector(".mdl-bg").animate([{opacity:0},{opacity:1}],{duration:300,fill:"both"});
    card.animate([{opacity:0,transform:"translateY(24px) scale(.92)",filter:"blur(8px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:520,easing:"cubic-bezier(.2,.9,.25,1.12)",fill:"both"});
    [...ct.children].forEach((li,k)=>li.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:420,delay:120+k*45,easing:"cubic-bezier(.2,.8,.2,1)",fill:"both"}))}
  mdl.querySelector(".mdl-x").focus();
}
function closeM(){
  if(mdl.hidden)return;
  const done=()=>{mdl.hidden=true;document.body.style.overflow="";cta.focus()};
  if(reduce)return done();
  mdl.querySelector(".mdl-bg").animate([{opacity:1},{opacity:0}],{duration:220,fill:"both"});
  card.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(16px) scale(.95)"}],{duration:220,easing:"ease-in",fill:"both"}).finished.then(done,done);
}
cta.onclick=openM;
mdl.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeM()});
document.addEventListener("keydown",e=>{
  if(mdl.hidden)return;
  if(e.key==="Escape")closeM();
  if(e.key==="Tab"){const f=[...card.querySelectorAll("a,button")];const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
},true);
card.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect();card.style.setProperty("--mx",(e.clientX-r.left)+"px");card.style.setProperty("--my",(e.clientY-r.top)+"px")});
}
